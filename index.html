<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mascote Animado</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; background: #eee; font-family: sans-serif; }
        model-viewer { width: 100vw; height: 100vh; }
        
        .btn-ra {
            position: absolute; bottom: 100px; left: 50%;
            transform: translateX(-50%); padding: 20px 40px; 
            font-size: 20px; background: #007bff; color: white; 
            border: none; border-radius: 50px; font-weight: bold;
            z-index: 10;
        }
        
        #btn-som {
            position: absolute; bottom: 30px; left: 50%;
            transform: translateX(-50%); padding: 15px 30px;
            background: #28a745; color: white; border: none;
            border-radius: 30px; font-weight: bold; display: none;
            z-index: 20;
        }
    </style>
</head>
<body>

    <audio id="audioFala" src="fala.mp3"></audio>

    <model-viewer 
        id="mascote"
        src="mascote.glb" 
        ar 
        ar-modes="scene-viewer quick-look webxr" 
        camera-controls
        /* Escala grande e sombra fixa */
        scale="0.2 0.2 0.2" 
        shadow-intensity="2"
        shadow-softness="0"
        /* Ativa a animação da boca (se existir no arquivo) */
        autoplay
        animation-name="*">
        
        <button slot="ar-button" class="btn-ra">✨ ABRIR CÂMERA (RA)</button>
        <button id="btn-som">🔊 OUVIR MENSAGEM</button>
    </model-viewer>

    <script>
        const modelViewer = document.querySelector('#mascote');
        const audio = document.querySelector('#audioFala');
        const btnSom = document.querySelector('#btn-som');

        modelViewer.addEventListener('ar-status', (event) => {
            if (event.detail.status === 'session-started') {
                btnSom.style.display = 'block';
            }
            if (event.detail.status === 'not-presenting') {
                btnSom.style.display = 'none';
                audio.pause();
            }
        });

        btnSom.addEventListener('click', () => {
            audio.currentTime = 0;
            audio.play();
            // Se o modelo tiver animação, resetamos ela junto com o som
            modelViewer.play();
        });
    </script>
</body>
</html>
