<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Mascote em RA</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; background: #f0f0f0; overflow: hidden; }
        model-viewer { width: 100vw; height: 100vh; }
        
        .btn-ra {
            position: absolute; bottom: 150px; left: 50%;
            transform: translateX(-50%); padding: 20px 40px; 
            font-size: 20px; background: #007bff; color: white; 
            border: none; border-radius: 40px; font-weight: bold;
            cursor: pointer; z-index: 100;
        }

        /* Botão de Repetir (Aparece em cima do mascote na RA) */
        .btn-repetir {
            background: #28a745; color: white; border: none;
            border-radius: 10px; padding: 10px 15px;
            font-weight: bold; cursor: pointer;
            display: none; /* Escondido até o áudio acabar */
        }
    </style>
</head>
<body>

    <audio id="audioFala" src="fala.mp3" preload="auto"></audio>

    <!-- Usamos scale 0.05 para ser 50% menor que o anterior -->
    <model-viewer 
        id="mascote"
        src="mascote.glb" 
        ar ar-modes="webxr scene-viewer quick-look" 
        ar-scale="auto" 
        scale="0.05 0.05 0.05" 
        camera-controls shadow-intensity="1">
        
        <button slot="ar-button" id="ar-button" class="btn-ra">
            ✨ VER NO MEU ESPAÇO
        </button>

        <!-- Ponto de interação que segue o personagem na RA -->
        <button slot="hotspot-repetir" id="hotspot-repetir" 
            class="btn-repetir" 
            data-position="0m 1m 0m" 
            data-normal="0m 0m 1m">
            🔄 Ouvir de novo
        </button>
    </model-viewer>

    <script>
        const modelViewer = document.querySelector('#mascote');
        const audio = document.querySelector('#audioFala');
        const btnRepetir = document.querySelector('#hotspot-repetir');
        const arButton = document.querySelector('#ar-button');

        // 1. Destrava o áudio no clique mas força silêncio inicial
        arButton.addEventListener('click', () => {
            audio.play().then(() => {
                audio.pause();
                audio.currentTime = 0;
            }).catch(() => {});
        });

        // 2. Só toca quando o objeto for EFETIVAMENTE colocado na cena
        modelViewer.addEventListener('ar-status', (event) => {
            if (event.detail.status === 'object-placed') {
                // Esconde botão de repetir se estiver visível de uma vez anterior
                btnRepetir.style.display = "none";
                
                // Pequeno delay para garantir que a interface de RA carregou
                setTimeout(() => {
                    audio.currentTime = 0;
                    audio.play();
                }, 1500); 
            }
        });

        // 3. Quando o áudio terminar, mostra a opção de "Ouvir novamente"
        audio.onended = () => {
            // Mostra o botão flutuante em cima do boneco
            btnRepetir.style.display = "block";
        };

        // 4. Função do botão de repetir dentro da RA
        btnRepetir.addEventListener('click', () => {
            btnRepetir.style.display = "none";
            audio.currentTime = 0;
            audio.play();
        });

        // Se sair da RA, limpa tudo
        modelViewer.addEventListener('ar-status', (event) => {
            if (event.detail.status === 'not-presenting') {
                audio.pause();
                btnRepetir.style.display = "none";
            }
        });
    </script>
</body>
</html>
