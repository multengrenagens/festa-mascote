<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Mascote Mult Engrenagens</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; }
        model-viewer { width: 100%; height: 100%; --ar-button-display: none; }
    </style>
</head>
<body>

    <model-viewer 
        id="mascote"
        src="mascote.glb" 
        ar 
        ar-modes="scene-viewer quick-look" 
        camera-controls 
        autoplay
        animation-name="*">
    </model-viewer>

    <script>
        // Este script tenta "clicar" no botão de RA para o usuário assim que carregar
        const modelViewer = document.querySelector("#mascote");
        modelViewer.addEventListener("load", () => {
            setTimeout(() => {
                modelViewer.activateAR();
            }, 500); 
        });
    </script>
</body>
</html>
