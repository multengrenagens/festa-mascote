<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Mascote Mult RA</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background: #000; }
        model-viewer { width: 100%; height: 100%; background-color: #eee; }
        #ar-button {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            padding: 15px 25px; background: #007bff; color: white; border: none;
            border-radius: 30px; font-weight: bold; z-index: 10;
        }
    </style>
</head>
<body>

    <button id="ar-button">CLIQUE AQUI PARA VER NA MESA</button>

    <model-viewer 
        id="model"
        src="mascote.glb" 
        ios-src="mascote.usdz"
        ar 
        ar-modes="quick-look scene-viewer" 
        camera-controls
        ar-scale="fixed"
        scale="0.01 0.01 0.01" 
        shadow-intensity="1">
    </model-viewer>

    <script>
        const modelViewer = document.querySelector("#model");
        const button = document.querySelector("#ar-button");
        const audio = new Audio("fala.mp3");
        audio.load();

        button.addEventListener("click", () => {
            // "Acorda" o áudio para o iOS
            audio.play().then(() => {
                audio.pause();
                audio.currentTime = 0;
            });
            
            // Força a entrada na RA
            modelViewer.activateAR();
        });

        // Tenta tocar quando o objeto é colocado
        modelViewer.addEventListener("ar-status", (event) => {
            if (event.detail.status === "object-placed") {
                audio.play();
                button.style.display = "none";
            }
        });
    </script>
</body>
</html>
