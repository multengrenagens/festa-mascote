<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confra Mult Engrenagens</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body { margin: 0; background: #004a8d; font-family: sans-serif; }
        model-viewer { width: 100vw; height: 100vh; background-color: #ffffff; }

        /* Estilo da "etiqueta" que aparecerá no mundo real */
        .desc-label {
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 15px;
            border-radius: 12px;
            border: 2px solid #FFD700;
            font-size: 16px;
            width: 280px;
            white-space: pre-wrap;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: none; /* Só mostra quando a RA inicia */
        }

        #ar-button {
            background: #FFD700;
            color: #004a8d;
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            font-weight: bold;
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
        }
    </style>
</head>
<body>

    <model-viewer 
        id="mv-mult"
        src="mascote.glb" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        shadow-intensity="1"
        ar-placement="floor"
        scale="0.2 0.2 0.2"
        min-camera-orbit="auto auto auto"
        max-camera-orbit="auto auto auto">
        
        <!-- Esse botão é o que o iPhone tenta ler para mostrar o texto dentro da RA -->
        <button id="hotspot-texto" class="desc-label" slot="hotspot-msg" data-position="0m 1m 0m" data-normal="0m 0m 1m">
            <div id="typewriter-target"></div>
        </button>

        <button slot="ar-button" id="ar-button">
            ABRIR INTERAÇÃO (15 ANOS MULT)
        </button>
    </model-viewer>

    <script>
        const modelViewer = document.querySelector('#mv-mult');
        const textTarget = document.querySelector('#typewriter-target');
        const hotspot = document.querySelector('#hotspot-texto');
        
        const fullText = "Seja bem-vindo à Confra de 15 anos da Mult.\nEsperamos que você aproveite bastante.\nA piscina está liberada para crianças e adultos.\nNossa primeira atração começa às 13 horas.\nDivirta-se e lembre-se: Se beber, não dirija.";

        function startTyping() {
            hotspot.style.display = 'block';
            let i = 0;
            textTarget.innerHTML = "";
            const interval = setInterval(() => {
                if (i < fullText.length) {
                    textTarget.innerHTML += fullText.charAt(i);
                    i++;
                } else {
                    clearInterval(interval);
                }
            }, 50);
        }

        // Para Android (WebXR)
        modelViewer.addEventListener('ar-status', (event) => {
            if (event.detail.status === 'session-started') {
                startTyping();
            }
        });

        // Para iPhone (Como o Quick Look é fechado, o texto precisa ser carregado antes ou via toque)
        // No iOS, se ele não carregar o hotspot, o texto aparecerá no modo 3D normal
        modelViewer.addEventListener('load', () => {
            startTyping();
        });
    </script>
</body>
</html>
