<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Confra Mult Engrenagens</title>

<script type="module"
src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
</script>

<style>
body{
    margin:0;
    overflow:hidden;
    font-family:sans-serif;
}

model-viewer{
    width:100vw;
    height:100vh;
    background:#f0f0f0;
}

#typing-container{
    position:absolute;
    bottom:10%;
    left:50%;
    transform:translateX(-50%);
    width:80%;
    background:rgba(0,0,0,0.8);
    color:white;
    padding:20px;
    border-radius:15px;
    font-size:1rem;
    display:none;
    z-index:100;
}

#ar-button{
    background:#004a8d;
    color:white;
    border:none;
    border-radius:30px;
    padding:15px 35px;
    font-size:18px;
    font-weight:bold;
}
</style>
</head>

<body>

<model-viewer
    id="viewer"
    src="mascote.glb"
    ios-src="mascote.usdz"
    ar
    ar-modes="scene-viewer quick-look webxr"
    camera-controls
    autoplay
    shadow-intensity="1"
    scale="0.1 0.1 0.1"
    alt="Mascote Mult Engrenagens">

    <button slot="ar-button" id="ar-button">
        👋 TOQUE PARA INICIAR
    </button>

</model-viewer>

<div id="typing-container">
    <span id="text"></span>
</div>

<script>

const modelViewer = document.querySelector("#viewer");

const typingContainer = document.getElementById("typing-container");

const textElement = document.getElementById("text");

const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);

const fullText =
`Seja bem-vindo à Confra de 15 anos da Mult.
Esperamos que aproveite bastante.
A piscina está liberada para crianças e adultos.
Nossa primeira atração começa às 13 horas.
Divirta-se e lembre-se:
Se beber, não dirija.`;

let index = 0;

function typeWriter(){

    if(index < fullText.length){

        const char = fullText.charAt(index);

        textElement.innerHTML +=
            char === "\n" ? "<br>" : char;

        index++;

        setTimeout(typeWriter,40);
    }
}

modelViewer.addEventListener("ar-status",(event)=>{

    if(event.detail.status === "session-started"){

        // Android/WebXR
        if(!isIOS){

            typingContainer.style.display = "block";

            textElement.innerHTML = "";

            index = 0;

            setTimeout(typeWriter,1000);
        }

        // iPhone
        else{

            // opcional: tocar áudio
            console.log("AR iniciado no iPhone");

        }
    }
});

</script>

</body>
</html>
