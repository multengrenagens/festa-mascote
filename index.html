<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mascote RA Final</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; background: #f0f0f0; font-family: sans-serif; overflow: hidden; }
        model-viewer { width: 100vw; height: 100vh; --poster-color: transparent; }
        
        .btn-ra {
            position: absolute; bottom: 180px; left: 50%;
            transform: translateX(-50%); padding: 25px 60px; 
            font-size: 26px; background: #007bff; color: white; 
            border: none; border-radius: 60px; font-weight: bold;
            cursor: pointer; z-index: 999; box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        #btn-repetir {
            position: absolute; bottom: 60px; left: 50%;
            transform: translateX(-50%); padding: 20px 45px;
            font-size: 20px; background: #28a745; color: white; 
            border: none; border-radius: 40px; font-weight: bold; 
            display: none; z-index: 1000;
        }
    </style>
</head>
<body>

    <audio id="audioFala" src="fala.mp3" preload="auto"></audio>

    <model-viewer 
        id="mascote"
        src="mascote.glb" 
        ar 
        ar-modes="webxr quick-look scene-viewer" 
        camera-controls
        /* Escala aumentada para visibilidade ideal */
        scale="0.15 0.15 0.15" 
        
        /* SOLUÇÃO DA SOMBRA: Aproxima o modelo do chão e intensifica o plano */
        shadow-intensity="2" 
        shadow-softness="0"
        ar-placement="floor"

        /* SOLUÇÃO IOS: Ativa o modo que permite áudio e RA simultâneos */
        ios-src="mascote.glb"
        quick-look-browsers="safari"
        
        loading="eager"
        reveal="auto">
        
        <button slot="ar-button" class="btn-ra">
            ✨ VER NO MEU ESPAÇO
        </button>

        <button id="btn-repetir" type="button">
            🔄 OUVIR NOVAMENTE
        </button>
    </model-viewer>

    <script>
        const modelViewer = document.querySelector('#mascote');
        const audio = document.querySelector('#audioFala');
        const btnRepetir = document.querySelector('#btn-repetir');
        const btnRA = document.querySelector('.btn-ra');

        let interacaoHumana = false;

        // Destrava o áudio para o sistema
        btnRA.addEventListener('click', () => {
            interacaoHumana = true;
            audio.play().then(() => {
                audio.pause();
                audio.currentTime = 0;
            }).catch(() => {});
        });

        // Gerenciamento de Estados
        modelViewer.addEventListener('ar-status', (event) => {
            if (event.detail.status === 'session-started') {
                btnRepetir.style.display = 'block';
                
                // No iOS, tentamos tocar o áudio com um delay maior
                // para esperar o Quick Look estabilizar
                if (interacaoHumana) {
                    setTimeout(() => {
                        audio.play();
                    }, 4000); 
                }
            }
            
            if (event.detail.status === 'not-presenting') {
                btnRepetir.style.display = 'none';
                audio.pause();
                audio.currentTime = 0;
            }
        });

        btnRepetir.addEventListener('click', () => {
            audio.currentTime = 0;
            audio.play();
        });
    </script>
</body>
</html>
