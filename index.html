<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confra Mult Engrenagens</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body { margin: 0; background: #f4f4f4; font-family: sans-serif; }
        model-viewer { width: 100vw; height: 100vh; --poster-color: transparent; }

        /* Container do Texto - Fica fixo na tela para não sumir no iPhone */
        #text-overlay {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            max-width: 400px;
            background: rgba(0, 74, 141, 0.9); /* Azul Mult */
            color: white;
            padding: 20px;
            border-radius: 15px;
            border: 2px solid #FFD700;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 1000;
            display: none; /* Só aparece quando clicar no AR */
            pointer-events: none;
        }

        #typewriter { font-size: 16px; line-height: 1.5; font-weight: 500; white-space: pre-wrap; }

        #ar-button {
            background: #004a8d;
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 50px;
            font-weight: bold;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <model-viewer 
        src="mascote.glb" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        shadow-intensity="1"
        ar-placement="floor"
	scale="0.1 0.1 0.1"
        alt="Mascote Mult Engrenagens">
        
        <button slot="ar-button" id="ar-button">
            🚀 INICIAR EXPERIÊNCIA RA
        </button>

        <div id="text-overlay">
            <div id="typewriter"></div>
        </div>
    </model-viewer>

    <script>
        const modelViewer = document.querySelector('model-viewer');
        const overlay = document.getElementById('text-overlay');
        const typewriter = document.getElementById('typewriter');
        
        const fullText = "Seja bem-vindo à Confra de 15 anos da Mult.\n\nEsperamos que aproveite bastante!\nA piscina está liberada.\nNossa primeira atração começa às 13h.\n\nDivirta-se e lembre-se: Se beber, não dirija.";

        function startTyping() {
            overlay.style.display = 'block';
            typewriter.innerHTML = "";
            let i = 0;
            const interval = setInterval(() => {
                typewriter.innerHTML += fullText.charAt(i);
                i++;
                if (i >= fullText.length) clearInterval(interval);
            }, 40);
        }

        // Monitor de estado para Android (WebXR)
        modelViewer.addEventListener('ar-status', (event) => {
            if (event.detail.status === 'session-started') {
                startTyping();
            }
        });

        // Fallback para iPhone (iOS Quick Look) e navegadores
        // Como o iOS bloqueia o HTML dentro da RA, o texto aparecerá 
        // antes ou logo após o usuário interagir.
        modelViewer.addEventListener('click', () => {
            if (overlay.style.display !== 'block') {
                startTyping();
            }
        });
    </script>
</body>
</html>
