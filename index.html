<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Mascote em RA</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; background: #f0f0f0; overflow: hidden; }
        model-viewer { width: 100vw; height: 100vh; }
        
        /* Botão RA Ajustado */
        .btn-ra {
            position: absolute; 
            /* 'bottom' controla a altura: aumente este valor para subir mais o botão */
            bottom: 150px; 
            left: 50%;
            transform: translateX(-50%);
            
            /* 'padding' e 'font-size' controlam o tamanho do botão */
            padding: 20px 40px; 
            font-size: 20px;
            
            background: #007bff;
            color: white; 
            border: none; 
            border-radius: 40px;
            font-family: sans-serif; 
            font-weight: bold;
            cursor: pointer; 
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
            white-space: nowrap; /* Impede que o texto quebre em duas linhas */
        }
    </style>
</head>
<body>

    <model-viewer 
        id="mascote"
        src="mascote.glb" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        ar-scale="auto" 
        scale="0.2 0.2 0.2" 
        camera-controls 
        shadow-intensity="1" 
        touch-action="pan-y">
        
        <button slot="ar-button" class="btn-ra">
            ✨ VER NO MEU ESPAÇO
        </button>
    </model-viewer>

</body>
</html>
