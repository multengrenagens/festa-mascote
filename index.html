<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Mascote GO - Mult Engrenagens</title>
    <!-- Bibliotecas Gratuitas de Realidade Aumentada e GPS -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">
    <a-scene
        vr-mode-ui="enabled: false"
        embedded
        arjs="sourceType: webcam; debugUIEnabled: false;">

        <!-- O MASCOTE: Substitua a latitude e longitude pelos números do Google Maps -->
        <a-entity
            gltf-model="url(./Waving.glb)"
            scale="5 5 5"
            look-at="[gps-camera]"
            gps-entity-place="latitude: -21.150417; longitude: -48.017346;"
	    animation-mixer="clip: *;"> </a-entity>
	    sound="src: url(./fala.mp3); autoplay: true; loop: true; distanceModel: exponential">
        ></a-entity>

        <a-camera gps-camera rotation-reader> </a-camera>
    </a-scene>
</body>
</html>
