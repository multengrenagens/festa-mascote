<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Mascote em RA</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; background: #f0f0f0; overflow: hidden; }
        model-viewer { width: 100vw; height: 100vh; }
        
        .btn-ra {
            position: absolute; 
            bottom: 150px; 
            left: 50%;
            transform: translateX(-50%);
            padding: 20px 40px; 
            font-size: 20px;
            background: #007bff;
            color: white; 
            border: none; 
            border-radius: 40px;
            font-family: sans-serif; 
            font-weight: bold;
            cursor: pointer; 
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
            white-space: nowrap;
            z-index: 100;
        }
    </style>
</head>
<body>

    <audio id="audioFala" src="fala.mp3" preload="auto"></audio>

    <model-viewer 
        id="mascote"
        src="mascote.glb" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        ar-scale="auto" 
        scale="0.1 0.1 0.1" 
        camera-controls 
        shadow-intensity="1" 
        touch-action="pan-y">
        
        <button slot="ar-button" id="ar-button" class="btn-ra">
            ✨ VER NO MEU ESPAÇO
        </button>
    </model-viewer>

    <script>
        const modelViewer = document.querySelector('#mascote');
        const audio = document.querySelector('#audioFala');
        const arButton = document.querySelector('#ar-button');

        // PASSO 1: O segredo está aqui. 
        // Quando o usuário clica no botão, nós "acordamos" o áudio.
        arButton.addEventListener('click', () => {
            audio.play().then(() => {
                audio.pause(); // Toca e pausa instantaneamente para ganhar permissão do sistema
                audio.currentTime = 0;
            }).catch(e => console.log("Erro ao pré-carregar áudio:", e));
        });

        // PASSO 2: Quando o objeto for colocado na mesa/chão, damos o play real.
        modelViewer.addEventListener('ar-status', (event) => {
            if (event.detail.status === 'object-placed') {
                audio.play();
            }
        });

        // Alternativa para garantir o play caso o status acima demore
        modelViewer.addEventListener('ar-button-activated', () => {
            // Pequeno delay para garantir que a transição de tela ocorreu
            setTimeout(() => {
                audio.play();
            }, 1000);
        });
    </script>

</body>
</html>
