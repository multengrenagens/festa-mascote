<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confra Mult Engrenagens 15 Anos</title>
    <!-- Importa o componente Model Viewer -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    
    <style>
        body { margin: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; overflow: hidden; }
        model-viewer { width: 100vw; height: 100vh; background-color: #f0f0f0; }

        /* Estilo do Texto Máquina de Escrever */
        #typing-container {
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 20px;
            border-radius: 15px;
            font-size: 1.1rem;
            line-height: 1.4;
            pointer-events: none; /* Não atrapalha o toque na RA */
            display: none; /* Escondido até a RA iniciar */
            border-left: 5px solid #FFD700; /* Cor de destaque para os 15 anos */
        }

        #cursor {
            display: inline-block;
            width: 8px;
            background-color: white;
            margin-left: 5px;
            animation: blink 0.7s infinite;
        }

        @keyframes blink {
            0% { opacity: 0; }
            50% { opacity: 1; }
            100% { opacity: 0; }
        }

        #ar-button {
            background-color: #004a8d; /* Tom de azul industrial */
            color: white;
            border-radius: 8px;
            border: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 15px 30px;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <model-viewer 
        src="mascote.glb" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        shadow-intensity="1" 
        autoplay
        alt="Mascote Mult Engrenagens">
        
        <button slot="ar-button" id="ar-button">
            👋 TOQUE PARA VER O MASCOTE
        </button>

        <div id="typing-container">
            <span id="text"></span><span id="cursor">&nbsp;</span>
        </div>
    </model-viewer>

    <script>
        const modelViewer = document.querySelector('model-viewer');
        const typingContainer = document.getElementById('typing-container');
        const textElement = document.getElementById('text');
        
        const fullText = "Seja bem-vindo à Confra de 15 anos da Mult.\nEsperamos que você aproveite bastante.\nA piscina está liberada para crianças e adultos.\nNossa primeira atração começa às 13 horas.\nDivirta-se e lembre-se: Se beber, não dirija.";

        let index = 0;

        function typeWriter() {
            if (index < fullText.length) {
                // Converte \n em quebras de linha reais no HTML
                if (fullText.charAt(index) === "\n") {
                    textElement.innerHTML += "<br>";
                } else {
                    textElement.innerHTML += fullText.charAt(index);
                }
                index++;
                setTimeout(typeWriter, 50); // Velocidade da digitação
            }
        }

        // Detecta quando o usuário entra no modo Realidade Aumentada
        modelViewer.addEventListener('ar-status', (event) => {
            if (event.detail.status === 'session-started') {
                typingContainer.style.display = 'block';
                setTimeout(typeWriter, 1500); // Pequeno atraso para o usuário se situar
            }
        });
    </script>
</body>
</html>
