<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">
    <a-scene 
        embedded 
        arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;"
        vr-mode-ui="enabled: false">
        
        <a-assets>
            <audio id="audioFala" src="fala.mp3" preload="auto"></audio>
        </a-assets>

        <a-marker type="pattern" url="pattern-marker.patt" id="meuMarcador">
            <a-entity
                gltf-model="url(./mascote.glb)"
                scale="1 1 1"
                position="0 0 0"
                animation-mixer="clip: *;">
            </a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const audio = document.querySelector('#audioFala');
        const marcador = document.querySelector('#meuMarcador');

        // Para o iOS permitir o som, o primeiro toque na tela "destrava" o áudio
        window.addEventListener('click', () => {
            audio.play();
            audio.pause(); 
            console.log("Áudio pronto");
        }, { once: true });

        marcador.addEventListener('markerFound', () => {
            audio.play();
        });

        marcador.addEventListener('markerLost', () => {
            audio.pause();
        });
    </script>
</body>
</html>
