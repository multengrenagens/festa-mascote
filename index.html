<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mascote Confraternização</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; background: #f0f0f0; font-family: sans-serif; overflow: hidden; }
        model-viewer { width: 100vw; height: 100vh; }
        
        /* Botão RA Gigante e bem visível */
        .btn-ra {
            position: absolute; 
            bottom: 180px; 
            left: 50%;
            transform: translateX(-50%); 
            padding: 25px 60px; 
            font-size: 26px; 
            background: #007bff; 
            color: white; 
            border: none; 
            border-radius: 60px; 
            font-weight: bold;
            cursor: pointer; 
            z-index: 999; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            white-space: nowrap;
        }

        #btn-repetir {
            position: absolute; 
            bottom: 60px; 
            left: 50%;
            transform: translateX(-50%); 
            padding: 20px 45px;
            font-size: 20px;
            background: #28a745; 
            color: white; 
            border: none;
            border-radius: 40px; 
            font-weight: bold; 
            display: none;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <audio id="audioFala" src="fala.mp3" preload="auto"></audio>

    <model-viewer 
        id="mascote"
        src="mascote.glb" 
        ios-src="mascote.glb" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        /* Escala aumentada para 0.09 (50% maior que 0.06) */
        scale="0.09 0.09 0.09" 
        camera-controls 
        
        /* Ajustes de Sombra para não sumir */
        shadow-intensity="1.5" 
        shadow-softness="0.5"
        exposure="1"
        
        ar-scale="auto"
        environment-image="neutral">
        
        <button slot="ar-button" id="ar-launch" class="btn-ra">
            ✨ VER NO MEU ESPAÇO
        </button>

        <button id="btn-repetir" type="button">
            🔄 OUVIR NOVAMENTE
        </button>
    </model-viewer>

    <script>
        const modelViewer = document.querySelector('#mascote');
        const audio = document.querySelector('#audioFala');
        const btnRepetir = document.querySelector('#btn-repetir');
        const arLaunch = document.querySelector('#ar-launch');

        function tocarAudio() {
            audio.currentTime = 0;
            audio.play().catch(e => console.log("Erro ao tocar áudio"));
        }

        arLaunch.addEventListener('click', () => {
            // "Acorda" o áudio no iOS/Android imediatamente
            audio.play().then(() => {
                audio.pause();
                // Delay para sincronizar com a abertura da RA no iPhone
                setTimeout(tocarAudio, 3500);
            }).catch(() => {
                // Caso o autoplay seja bloqueado, o botão de repetir salvará
            });
        });

        modelViewer.addEventListener('ar-status', (event) => {
            if (event.detail.status === 'session-started') {
                btnRepetir.style.display = 'block';
            }
            if (event.detail.status === 'not-presenting') {
                btnRepetir.style.display = 'none';
                audio.pause();
            }
            // Tenta forçar o play se o objeto for colocado
            if (event.detail.status === 'object-placed') {
                // Se o áudio ainda não estiver tocando, tentamos aqui
                if(audio.paused) tocarAudio();
            }
        });

        btnRepetir.addEventListener('click', tocarAudio);
    </script>
</body>
</html>
