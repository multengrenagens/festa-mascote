<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Mascote em RA</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; background: #f0f0f0; overflow: hidden; font-family: sans-serif; }
        model-viewer { width: 100vw; height: 100vh; }
        
        /* Botão para entrar na RA */
        .btn-ra {
            position: absolute; bottom: 150px; left: 50%;
            transform: translateX(-50%); padding: 20px 40px; 
            font-size: 20px; background: #007bff; color: white; 
            border: none; border-radius: 40px; font-weight: bold;
            cursor: pointer; z-index: 100;
        }

        /* Botão de Áudio que aparece DENTRO da RA */
        #controles-ra {
            position: absolute; bottom: 50px; left: 50%;
            transform: translateX(-50%); z-index: 200;
            display: none; /* Escondido por padrão */
        }

        .btn-audio {
            padding: 15px 30px; background: #28a745; color: white;
            border: none; border-radius: 30px; font-weight: bold;
            font-size: 18px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <audio id="audioFala" src="fala.mp3" preload="auto"></audio>

    <!-- Forçamos o webxr primeiro para manter o controle do áudio -->
    <model-viewer 
        id="mascote"
        src="mascote.glb" 
        ar 
        ar-modes="webxr scene-viewer" 
        scale="0.05 0.05 0.05" 
        camera-controls 
        shadow-intensity="1">
        
        <button slot="ar-button" class="btn-ra">
            ✨ VER NO MEU ESPAÇO
        </button>

        <!-- Interface de controle que o model-viewer permite mostrar na RA -->
        <div id="controles-ra">
            <button class="btn-audio" id="play-repetir">🔊 OUVIR MENSAGEM</button>
        </div>
    </model-viewer>

    <script>
        const modelViewer = document.querySelector('#mascote');
        const audio = document.querySelector('#audioFala');
        const painelControle = document.querySelector('#controles-ra');
        const btnPlay = document.querySelector('#play-repetir');

        // 1. Monitora a entrada na RA
        modelViewer.addEventListener('ar-status', (event) => {
            if (event.detail.status === 'session-started') {
                // Usuário entrou na RA: Mostra o botão de Play
                painelControle.style.display = 'block';
            } else if (event.detail.status === 'not-presenting') {
                // Usuário saiu da RA: Esconde o botão e para o áudio
                painelControle.style.display = 'none';
                audio.pause();
                audio.currentTime = 0;
            }
        });

        // 2. Ação do botão de Play/Repetir
        btnPlay.addEventListener('click', () => {
            audio.currentTime = 0;
            audio.play();
            btnPlay.innerText = "🔄 OUVIR NOVAMENTE";
        });

        // 3. Auto-play opcional quando o objeto for colocado (apenas se o navegador permitir)
        modelViewer.addEventListener('ar-status', (event) => {
            if (event.detail.status === 'object-placed') {
                // Tentativa de play automático ao detectar a mesa
                audio.play().catch(() => {
                    console.log("Play automático bloqueado. Aguardando clique no botão.");
                });
            }
        });
    </script>
</body>
</html>
