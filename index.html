<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mascote Confraternização</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; background: #f0f0f0; font-family: sans-serif; overflow: hidden; }
        model-viewer { width: 100vw; height: 100vh; }
        
        /* Botão Principal */
        .btn-ra {
            position: absolute; bottom: 100px; left: 50%;
            transform: translateX(-50%); padding: 20px 40px; 
            font-size: 22px; background: #007bff; color: white; 
            border: none; border-radius: 50px; font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3); z-index: 10;
        }

        /* Botão de Áudio (Aparece após entrar na RA) */
        #btn-play {
            position: absolute; bottom: 30px; left: 50%;
            transform: translateX(-50%); padding: 15px 30px;
            background: #28a745; color: white; border: none;
            border-radius: 30px; font-weight: bold; display: none;
            z-index: 20;
        }
    </style>
</head>
<body>

    <audio id="audioFala" src="fala.mp3" preload="auto"></audio>

    <model-viewer 
        id="mascote"
        src="mascote.glb" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        ar-scale="fixed"
        scale="0.2 0.2 0.2" 
        camera-controls 
        shadow-intensity="1.5"
        shadow-softness="0"
        ar-placement="floor">
        
        <button slot="ar-button" class="btn-ra">
            ✨ VER MENSAGEM
        </button>

        <button id="btn-play">
            🔊 OUVIR FALA
        </button>
    </model-viewer>

    <script>
        const modelViewer = document.querySelector('#mascote');
        const audio = document.querySelector('#audioFala');
        const btnPlay = document.querySelector('#btn-play');

        // Gerencia a entrada na RA
        modelViewer.addEventListener('ar-status', (event) => {
            if (event.detail.status === 'session-started') {
                // Mostra o botão de som quando a câmera abre
                btnPlay.style.display = 'block';
                
                // Tenta o autoplay (funciona no Android)
                setTimeout(() => {
                    audio.play().catch(() => {
                        console.log("iOS barrou o som automático. Aguardando clique.");
                    });
                }, 1000);
            }
            if (event.detail.status === 'not-presenting') {
                btnPlay.style.display = 'none';
                audio.pause();
            }
        });

        // Clique manual para garantir o som no iPhone
        btnPlay.addEventListener('click', () => {
            audio.currentTime = 0;
            audio.play();
            btnPlay.innerText = "🔄 OUVIR NOVAMENTE";
        });
    </script>
</body>
</html>
