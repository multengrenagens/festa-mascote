<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Mascote em RA</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; background: #f0f0f0; overflow: hidden; }
        model-viewer { width: 100vw; height: 100vh; }
        
        .btn-ra {
            position: absolute; 
            bottom: 150px; 
            left: 50%;
            transform: translateX(-50%);
            padding: 20px 40px; 
            font-size: 20px;
            background: #007bff;
            color: white; 
            border: none; 
            border-radius: 40px;
            font-family: sans-serif; 
            font-weight: bold;
            cursor: pointer; 
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
            z-index: 100;
        }
    </style>
</head>
<body>

    <audio id="audioFala" src="fala.mp3" preload="auto"></audio>

    <model-viewer 
        id="mascote"
        src="mascote.glb" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        ar-scale="auto" 
        scale="0.05 0.05 0.05" 
        camera-controls 
        shadow-intensity="1">
        
        <button slot="ar-button" id="ar-button" class="btn-ra">
            ✨ VER NO MEU ESPAÇO
        </button>
    </model-viewer>

    <script>
        const modelViewer = document.querySelector('#mascote');
        const audio = document.querySelector('#audioFala');
        const arButton = document.querySelector('#ar-button');

        let raAtiva = false;

        // 1. O clique APENAS libera o áudio (destrava o navegador)
        arButton.addEventListener('click', () => {
            audio.play().then(() => {
                audio.pause();
                audio.currentTime = 0;
            }).catch(() => {});
        });

        // 2. Monitora a mudança de estado para RA
        modelViewer.addEventListener('ar-status', (event) => {
            // "session-started" significa que a câmera abriu
            if (event.detail.status === 'session-started') {
                raAtiva = true;
            } 
            
            // "object-placed" significa que o boneco apareceu na mesa
            if (event.detail.status === 'object-placed' && raAtiva) {
                // Resetamos e tocamos com um atraso para garantir que a tela já mudou
                audio.currentTime = 0;
                setTimeout(() => {
                    audio.play();
                    // Resetamos a trava para não tocar de novo se ele perder o rastreio e achar a mesa de novo
                    raAtiva = false; 
                }, 1200); // 1.2 segundos é o tempo médio de transição de tela
            }

            // Se o usuário sair da RA, paramos o áudio
            if (event.detail.status === 'not-presenting') {
                audio.pause();
                audio.currentTime = 0;
                raAtiva = false;
            }
        });
    </script>

</body>
</html>
