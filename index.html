<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mascote Confraternização</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; background: #f0f0f0; font-family: sans-serif; }
        model-viewer { width: 100vw; height: 100vh; }
        
        /* Botão RA maior para Android e iOS */
        .btn-ra {
            position: absolute; 
            bottom: 180px; /* Subiu um pouco mais */
            left: 50%;
            transform: translateX(-50%); 
            padding: 25px 50px; /* Botão bem mais largo e alto */
            font-size: 24px; /* Letra maior */
            background: #007bff; 
            color: white; 
            border: none; 
            border-radius: 60px; 
            font-weight: bold;
            cursor: pointer; 
            z-index: 999; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            white-space: nowrap;
        }

        #btn-repetir {
            position: absolute; 
            bottom: 60px; 
            left: 50%;
            transform: translateX(-50%); 
            padding: 20px 40px;
            font-size: 18px;
            background: #28a745; 
            color: white; 
            border: none;
            border-radius: 40px; 
            font-weight: bold; 
            display: none;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <audio id="audioFala" src="fala.mp3" preload="auto"></audio>

    <model-viewer 
        id="mascote"
        src="mascote.glb" 
        /* ios-src é essencial para iPhone. Se não tiver um .usdz, o iPhone usa o .glb via Quick Look automático */
        ios-src="mascote.glb" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        /* Aumentado em 20%: de 0.05 para 0.06 */
        scale="0.06 0.06 0.06" 
        camera-controls 
        shadow-intensity="1"
        ar-scale="auto">
        
        <button slot="ar-button" id="ar-launch" class="btn-ra">
            ✨ VER NO MEU ESPAÇO
        </button>

        <button id="btn-repetir" type="button">
            🔄 OUVIR NOVAMENTE
        </button>
    </model-viewer>

    <script>
        const modelViewer = document.querySelector('#mascote');
        const audio = document.querySelector('#audioFala');
        const btnRepetir = document.querySelector('#btn-repetir');
        const arLaunch = document.querySelector('#ar-launch');

        function tocarAudio() {
            audio.currentTime = 0;
            audio.play().catch(e => console.log("Áudio aguardando interação..."));
        }

        // Correção para o iPhone: O clique precisa disparar a intenção de áudio imediatamente
        arLaunch.addEventListener('click', () => {
            // No iOS, se dispararmos o áudio muito tarde, ele bloqueia. 
            // Vamos tocar um silêncio rápido para "abrir" o canal de áudio.
            audio.play().then(() => {
                audio.pause();
                // O play real acontece com um pequeno delay para a transição da câmera
                setTimeout(tocarAudio, 3000);
            });
        });

        modelViewer.addEventListener('ar-status', (event) => {
            if (event.detail.status === 'session-started') {
                btnRepetir.style.display = 'block';
            }
            if (event.detail.status === 'not-presenting') {
                btnRepetir.style.display = 'none';
                audio.pause();
            }
        });

        btnRepetir.addEventListener('click', tocarAudio);
    </script>
</body>
</html>
